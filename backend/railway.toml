[build]
builder = "nixpacks"
# No `npm ci` here — nixpacks already runs an install phase before this command.
# Running it again fails with EBUSY, because npm tries to remove
# /app/node_modules/.cache while it is mounted as a build cache volume.
# Generate the Prisma client at build time so the compiled JS can import it.
buildCommand = "npx prisma generate && npm run build"

[deploy]
# Run pending migrations before starting — safe to re-run on every deploy
startCommand = "npx prisma migrate deploy && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
